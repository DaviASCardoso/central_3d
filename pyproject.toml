[project]
name = "central"
version = "0.1.0"
description = "Catálogo executável de produtos paramétricos para impressão 3D."
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "Proprietary" }
authors = [{ name = "Davi Cardoso" }]

# As dependências pesadas ficam fixadas em "==" para que o ambiente seja
# reprodutível: OCCT, VTK e Qt carregam binários nativos cuja troca de versão
# muda comportamento de geometria e de renderização sem aviso.
dependencies = [
    "build123d==0.11.1",
    "cadquery-ocp-novtk==7.9.3.1.1",
    "lib3mf==2.5.0",
    "numpy==2.5.1",
    "PySide6==6.11.1",
    "trimesh==4.12.2",
    "vtk==9.6.2",
]

[dependency-groups]
dev = [
    "pytest~=8.4",
    "pytest-qt~=4.5",
    "ruff~=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["central"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "PTH", # flake8-use-pathlib -- secao 18: nenhum os.path
    "T20", # flake8-print -- secao 18: logging, nunca print
    "D",   # pydocstyle -- secao 18: docstring em toda funcao publica
    "ANN", # flake8-annotations -- secao 18: anotacao de tipo completa
    "E722",# secao 18: nenhum except nu
]
ignore = [
    "D203", # conflita com D211
    "D213", # conflita com D212
    # N818 exige sufixo "Error" em exceção. A seção 18 manda identificadores do
    # domínio em português, e o prefixo "Erro" é o equivalente direto.
    "N818",
    # ANN401 proíbe `Any` em argumento e retorno. O contrato é deliberadamente
    # heterogêneo: o tipo de um valor de parâmetro só se conhece em tempo de
    # execução, a partir do `TipoParam` declarado. Trocar por union fechada
    # mentiria sobre o que a função aceita. A seção 18 exige anotação completa,
    # e `Any` aqui é a anotação honesta.
    "ANN401",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Testes não precisam de docstring pública nem de anotação de retorno.
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "ANN"]
# A CLI é a única camada autorizada a escrever na saída padrão.
"central/cli.py" = ["T20"]
# O template de produto é esqueleto comentado, não código executado.
"produtos/_template/*" = ["D", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "ui: testes que precisam de um QApplication",
]
